# Copy to config.yaml. Environment variables (see .env.example) override these values.
port: 3000
# The single immutable development user id
dev_user_id: dev-user
data_root: ./data
db_path: ./data/journaletto.db
# fake | local | external
provider: fake
max_retries: 3
# Number of concurrent background processing workers
worker_concurrency: 1
# Max size of one journal entry in bytes
max_entry_bytes: 102400
# Ollama adapter, used when provider: local (env: OLLAMA_ENDPOINT, OLLAMA_LLM_MODEL, ...)
ollama_endpoint: http://localhost:11434
ollama_llm_model: llama3.1
ollama_embed_model: nomic-embed-text
ollama_timeout_seconds: 120
ollama_num_ctx: 8192
ollama_temperature: 0
