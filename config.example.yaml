# Journal Recall — example development configuration.
#
# Copy this file to config.yaml (gitignored) and adjust as needed. No secrets
# or machine-specific absolute paths should ever be committed to this
# example file; use relative paths and placeholders instead.

# --- Milestone 1, Slice 1 (active now) ---

# Immutable development user ID. Stands in for real per-user identity, which
# is out of scope for the MVP (no auth). All raw journal files are stored
# under a directory named after this ID.
dev_user_id: "dev-user-001"

# Filesystem root under which per-user journal directories are created.
# Relative paths are resolved against the process's working directory.
journal_root: "./data/journals"

# Maximum size, in bytes, of one fully rendered journal entry file
# (front matter + heading + body). Spec requirement: 100 KB.
max_entry_bytes: 102400

# Maximum number of user tags allowed on one entry. Spec requirement: 100.
max_tags: 100

# Address the HTTP server listens on.
listen_addr: ":8080"

# --- Reserved for later milestones (documented now, unused until then) ---

# Milestone 1 (later slices): path to the SQLite database file holding the
# canonical entry representation, FTS5 index, entities, chunks and rule
# occurrences.
# sqlite_path: "./data/journal.sqlite"

# Milestone 1 (later slices): location or configuration of the local
# SQLite-compatible vector extension (e.g. sqlite-vec) used for embeddings.
# vector_extension_path: "./data/vec0.so"

# Milestone 1 (later slices): model provider used for enrichment, entity
# extraction, chunking and embeddings. One of "local", "external", "fake".
# model_provider: "local"

# Milestone 1 (later slices): local model runtime endpoint (e.g. an Ollama
# or llama.cpp server) and the model identifiers to use.
# model_endpoint: "http://localhost:11434"
# llm_model_id: ""
# embedding_model_id: ""

# Milestone 1 (later slices): request timeout, retry count and processing
# concurrency for background model calls.
# model_request_timeout_seconds: 30
# processing_retry_count: 3
# processing_concurrency: 1

# Milestone 4 (Journal Recall): directory exports (raw files, PDF recall
# responses) are written to.
# export_dir: "./data/exports"
