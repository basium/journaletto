services:
  app:
    build:
      context: .
      target: runtime
      args:
        VERSION: "${VERSION:-dev}"
        COMMIT: "${COMMIT:-unknown}"
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      DEV_USER_ID: "${DEV_USER_ID:-dev-user}"
      PROVIDER: "${PROVIDER:-fake}"
      # Only used when PROVIDER=local. Defaults to the compose ollama service.
      OLLAMA_ENDPOINT: "${OLLAMA_ENDPOINT:-http://ollama:11434}"
      OLLAMA_LLM_MODEL: "${OLLAMA_LLM_MODEL:-llama3.1}"
      OLLAMA_EMBED_MODEL: "${OLLAMA_EMBED_MODEL:-nomic-embed-text}"
    # Waits for Ollama and the models only when the `local-llm` profile is active;
    # without the profile these services are not part of the project and are skipped.
    depends_on:
      ollama:
        condition: service_healthy
        required: false
      ollama-pull:
        condition: service_completed_successfully
        required: false
    volumes:
      - journaletto-data:/data

  # Optional local LLM: docker compose --profile local-llm up   (with PROVIDER=local)
  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # One-shot: pulls the configured models into the ollama volume, then exits.
  ollama-pull:
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_LLM_MODEL: "${OLLAMA_LLM_MODEL:-llama3.1}"
      OLLAMA_EMBED_MODEL: "${OLLAMA_EMBED_MODEL:-nomic-embed-text}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama pull "$$OLLAMA_LLM_MODEL" && ollama pull "$$OLLAMA_EMBED_MODEL"
    restart: "no"

volumes:
  journaletto-data:
  ollama-models:
