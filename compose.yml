services:
  app:
    build:
      context: .
      target: runtime
      args:
        VERSION: "${VERSION:-dev}"
        COMMIT: "${COMMIT:-unknown}"
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      DEV_USER_ID: "${DEV_USER_ID:-dev-user}"
      PROVIDER: "${PROVIDER:-fake}"
    volumes:
      - journaletto-data:/data

volumes:
  journaletto-data:
