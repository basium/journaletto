{{define "result"}}{{if .Error}}<p class="error" role="alert" data-field="{{.Error.Field}}">{{.Error.Field}}: {{.Error.Message}}</p>{{else if .Saved}}<p class="success">Entry {{if .Updated}}updated{{else}}saved{{end}} (<a href="/entries/{{.Saved.ID}}">{{.Saved.ID}}</a>), processing: {{.Saved.Status}}</p>{{end}}{{end}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Journaletto</title>
  <meta name="htmx-config" content='{"responseHandling":[{"code":".*","swap":true}]}'>
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <h1>Journaletto</h1>
  <form method="post" action="/entries" hx-post="/entries" hx-target="#result">
    <p><label>Title <input name="title" maxlength="200" required value="{{.Form.Title}}"></label></p>
    <p><label>Date <input type="date" name="journal_date" value="{{.Form.JournalDate}}"></label></p>
    <p><label>Description <textarea name="description" rows="10">{{.Form.Description}}</textarea></label></p>
    <p><label>Tags (comma separated)
      <input name="tags" list="tag-suggestions" autocomplete="off" value="{{.TagsText}}"
        hx-get="/tags" hx-trigger="keyup changed delay:200ms" hx-target="#tag-suggestions" hx-swap="innerHTML">
    </label>
    <datalist id="tag-suggestions"></datalist></p>
    <input type="hidden" name="timezone" id="timezone" value="{{.Form.Timezone}}">
    <button type="submit">Save</button>
  </form>
  <div id="result">{{template "result" .}}</div>
  <script>
    document.getElementById("timezone").value = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
    var dateEl = document.querySelector('input[name="journal_date"]');
    if (!dateEl.value) {
      var d = new Date(), p = function (n) { return String(n).padStart(2, "0"); };
      dateEl.value = d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
    }
  </script>
</body>
</html>
